name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh live LeetCode stats cache
        run: |
          node -e "import('./server/leetcodeHandler.js').then(async m => { try { const res = await m.getLeetCodeStats('Mallikarjuna_Boya', true); const fs = await import('fs'); fs.mkdirSync('public/api', { recursive: true }); fs.writeFileSync('public/api/leetcode.json', JSON.stringify(res.body, null, 2)); console.log('Successfully refreshed LeetCode stats for build:', res.body.totalSolved); } catch (e) { console.warn('Could not refresh live stats during build, using fallback:', e.message); } })"

      - name: Build project with Vite
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
